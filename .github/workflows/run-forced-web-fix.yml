name: Run forced web verification fix

on:
  push:
    branches:
      - agent/safer-faster-ai

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/safer-faster-ai
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/fix_forced_web_flag.py
      - name: Run tests
        run: python -m unittest tests/test_ai_chat.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py tests/test_ai_chat.py
          git commit -m "Forward forced AI verification flag"
          git push origin agent/safer-faster-ai
