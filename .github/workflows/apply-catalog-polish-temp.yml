name: Apply catalog polish temporary

on:
  push:
    branches:
      - agent/polish-catalog-and-ai-tone
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/polish-catalog-and-ai-tone
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend test dependencies
        run: python -m pip install fastapi==0.110.1 python-dotenv motor==3.3.1 pymongo==4.5.0 openai==1.99.9 PyJWT==2.12.1 pandas==3.0.1 email-validator==2.3.0 python-multipart==0.0.22
      - name: Apply catalog patch
        id: patch
        continue-on-error: true
        run: python scripts/apply_catalog_polish.py > patch.log 2>&1
      - name: Recover server patch
        if: steps.patch.outcome == 'failure'
        run: python scripts/recover_catalog_polish.py
      - name: Validate Python syntax
        run: python -m py_compile backend/catalog_quality.py backend/product_catalog.py backend/migrate_catalog_to_supabase.py backend/server.py
      - name: Run focused tests
        run: python -m unittest tests/test_catalog_polish.py tests/test_unified_catalog.py tests/test_ai_chat.py tests/test_auth_and_limits.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/product_catalog.py backend/migrate_catalog_to_supabase.py backend/server.py
          git diff --cached --quiet || git commit -m "Polish catalog cleanup and AI agronomist tone"
          git push
