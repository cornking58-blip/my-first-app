name: Apply catalog polish temporary

on:
  push:
    branches:
      - agent/polish-catalog-and-ai-tone

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/polish-catalog-and-ai-tone
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python scripts/apply_catalog_polish.py
      - name: Validate Python syntax
        run: python -m py_compile backend/catalog_quality.py backend/product_catalog.py backend/migrate_catalog_to_supabase.py backend/server.py
      - name: Run focused tests
        run: python -m unittest tests/test_catalog_polish.py tests/test_unified_catalog.py tests/test_ai_chat.py tests/test_auth_and_limits.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/product_catalog.py backend/migrate_catalog_to_supabase.py backend/server.py
          git diff --cached --quiet || git commit -m "Polish catalog cleanup and AI agronomist tone"
          git push
