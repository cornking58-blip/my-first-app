name: Apply Supabase secret key support

on:
  push:
    branches:
      - agent/support-supabase-secret-key

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/support-supabase-secret-key
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python scripts/apply_supabase_secret_key_support.py
      - name: Validate Python syntax
        run: python -m py_compile backend/supabase_auth.py backend/product_catalog.py backend/migrate_catalog_to_supabase.py backend/catalog_auto_migrate.py
      - name: Run focused tests
        run: python -m unittest tests/test_supabase_api_keys.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/product_catalog.py backend/migrate_catalog_to_supabase.py backend/catalog_auto_migrate.py
          git diff --cached --quiet || git commit -m "Support modern Supabase secret keys"
          git push
