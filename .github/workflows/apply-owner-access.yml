name: Apply owner unlimited access

on:
  push:
    branches:
      - agent/owner-unlimited-access

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/owner-unlimited-access
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python scripts/apply_owner_access.py
      - name: Run focused tests
        run: python -m unittest tests/test_auth_and_limits.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py tests/test_auth_and_limits.py
          git diff --cached --quiet || git commit -m "Add unlimited owner access"
          git push
