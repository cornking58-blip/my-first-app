name: Apply all-category compare entry

on:
  push:
    branches:
      - agent/pr-81-all-category-compare

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr-81-all-category-compare
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply main entry patch
        run: python scripts/apply_all_category_compare_entry.py
      - name: Install Yarn 1
        run: npm install --global yarn@1.22.22 --silent
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --silent
      - name: TypeScript check
        working-directory: frontend
        run: yarn exec tsc --noEmit
      - name: Commit working changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'frontend/app/(tabs)/index.tsx'
          git diff --cached --quiet || git commit -m "Route main comparison to all categories"
          git push
