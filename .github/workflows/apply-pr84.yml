name: Apply PR84 test payments

on:
  push:
    branches:
      - agent/pr-84-test-payments

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: baikov_test
      AUTH_JWT_SECRET: test-secret-with-at-least-thirty-two-characters
      PAYMENTS_MODE: mock
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr-84-test-payments
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply source patch
        run: python scripts/apply_pr84.py
      - name: Install backend dependencies
        run: >-
          python -m pip install --quiet
          fastapi==0.110.1
          python-dotenv
          motor==3.3.1
          pymongo==4.5.0
          httpx==0.28.1
          openai==1.99.9
          PyJWT==2.12.1
          pandas==3.0.1
          email-validator==2.3.0
          python-multipart==0.0.22
      - name: Validate backend
        run: |
          python -m py_compile backend/payments.py backend/server.py
          python -m unittest -v tests/test_payments.py
          python -m unittest -v tests/test_account_limits.py
          python -m unittest -v tests/test_ai_chat.py
          python -m unittest -v tests/test_photo_diagnosis.py
      - name: Install Yarn 1
        run: npm install --global yarn@1.22.22 --silent
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --silent
      - name: TypeScript check
        working-directory: frontend
        run: yarn exec tsc --noEmit
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add test payments and PRO activation"
          git push
