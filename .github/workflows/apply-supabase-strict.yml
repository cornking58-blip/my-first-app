name: Apply strict Supabase catalog

on:
  push:
    branches:
      - agent/supabase-catalog-strict
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supabase-catalog-strict
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install fastapi==0.110.1 python-dotenv motor==3.3.1 pymongo==4.5.0 httpx==0.28.1 openai==1.99.9 PyJWT==2.12.1 pandas==3.0.1 email-validator==2.3.0 python-multipart==0.0.22
      - name: Apply source patch
        run: |
          if ! grep -q "build_strict_catalog_ai_context" backend/server.py; then
            python scripts/apply_supabase_catalog_strict.py
          fi
      - name: Validate Python syntax
        run: python -m py_compile backend/strict_catalog_ai.py backend/catalog_auto_migrate.py backend/product_catalog.py backend/migrate_catalog_to_supabase.py backend/server.py
      - name: Run focused tests
        id: tests
        continue-on-error: true
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: baikov_test
          AUTH_JWT_SECRET: test-secret-with-at-least-thirty-two-characters
        run: python -m unittest tests/test_supabase_strict_catalog.py tests/test_unified_catalog.py tests/test_catalog_polish.py tests/test_ai_chat.py tests/test_auth_and_limits.py > tests.log 2>&1
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-strict-tests-log
          path: tests.log
      - name: Stop after test error
        if: steps.tests.outcome == 'failure'
        run: |
          cat tests.log
          exit 1
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py backend/product_catalog.py
          git diff --cached --quiet || git commit -m "Make Supabase catalog strict and prevent product guessing"
          git push
