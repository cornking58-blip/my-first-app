name: Run AI safety patch

on:
  push:
    branches:
      - agent/safer-faster-ai

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/safer-faster-ai
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_safer_faster_ai.py
      - name: Run tests
        run: python -m unittest tests/test_ai_chat.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py frontend/app/ai.tsx tests/test_ai_chat.py
          git commit -m "Make AI safer faster and cleaner"
          git push origin agent/safer-faster-ai
