name: Apply active substance follow-ups

on:
  push:
    branches:
      - agent/active-substance-followups

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/active-substance-followups
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused test dependencies
        run: python -m pip install fastapi==0.110.1 python-dotenv motor==3.3.1 pymongo==4.5.0 httpx==0.28.1 openai==1.99.9 PyJWT==2.12.1 pandas==3.0.1 email-validator==2.3.0 python-multipart==0.0.22
      - name: Apply patch
        run: python scripts/apply_active_substance_followups.py
      - name: Validate syntax
        run: python -m py_compile backend/strict_catalog_ai.py
      - name: Run focused tests
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: baikov_test
          AUTH_JWT_SECRET: test-secret-with-at-least-thirty-two-characters
        run: python -m unittest tests/test_supabase_strict_catalog.py tests/test_ai_chat.py tests/test_unified_catalog.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/strict_catalog_ai.py tests/test_supabase_strict_catalog.py
          git diff --cached --quiet || git commit -m "Recognize active substances in follow-up questions"
          git push
