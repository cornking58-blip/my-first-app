name: Fix catalog import

on:
  push:
    branches:
      - agent/unified-pesticide-catalog

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-pesticide-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply import fix
        run: python scripts/fix_catalog_import.py
      - name: Validate
        run: |
          python -m py_compile backend/product_catalog.py backend/migrate_catalog_to_supabase.py backend/server.py
          python -m unittest tests/test_unified_catalog.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py
          git diff --cached --quiet || git commit -m "Make catalog import Railway-safe"
          git push
