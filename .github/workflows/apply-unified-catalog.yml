name: Apply unified pesticide catalog

on:
  push:
    branches:
      - agent/unified-pesticide-catalog
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-pesticide-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply initial source patch when needed
        run: |
          if ! grep -q "create_products_router" backend/server.py; then
            python scripts/apply_unified_catalog.py
          fi
      - name: Apply final database-first patch when needed
        run: |
          if ! grep -q "build_direct_catalog_answer(context)" backend/server.py; then
            python scripts/finalize_unified_catalog.py
          fi
      - name: Validate Python syntax
        run: |
          python -m py_compile backend/product_catalog.py
          python -m py_compile backend/migrate_catalog_to_supabase.py
          python -m py_compile backend/server.py
      - name: Run focused tests
        run: python -m unittest tests/test_unified_catalog.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py backend/product_catalog.py backend/requirements.txt frontend/app/'(tabs)'/index.tsx frontend/app/ai.tsx tests/test_unified_catalog.py
          git diff --cached --quiet || git commit -m "Finalize database-first pesticide catalog"
          git push
