name: Apply unified pesticide catalog

on:
  push:
    branches:
      - agent/unified-pesticide-catalog

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-pesticide-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply source patch
        run: python scripts/apply_unified_catalog.py
      - name: Validate Python syntax
        run: |
          python -m py_compile backend/product_catalog.py
          python -m py_compile backend/migrate_catalog_to_supabase.py
          python -m py_compile backend/server.py
      - name: Run focused tests
        run: python -m unittest tests/test_unified_catalog.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py backend/requirements.txt frontend/app/'(tabs)'/index.tsx frontend/app/ai.tsx
          git diff --cached --quiet || git commit -m "Connect unified pesticide catalog"
          git push
