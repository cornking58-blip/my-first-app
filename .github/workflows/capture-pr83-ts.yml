name: Capture PR83 TypeScript diagnostics

on:
  push:
    branches:
      - agent/pr-83-account-and-trial-limits

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr-83-account-and-trial-limits
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Yarn 1
        run: npm install --global yarn@1.22.22 --silent
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --silent
      - name: Capture TypeScript output
        working-directory: frontend
        run: yarn exec tsc --noEmit > ../pr83-ts-errors.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr83-ts-errors.txt
          git diff --cached --quiet || git commit -m "Capture current PR83 TypeScript diagnostics"
          git push
