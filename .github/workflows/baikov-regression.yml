name: bAIkov regression

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: baikov_test
      AUTH_JWT_SECRET: test-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr-83-account-and-trial-limits
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply PR83 source patch
        run: python scripts/apply_account_limits_v2.py
      - name: Fix account TypeScript compatibility
        run: python scripts/fix_account_types.py
      - name: Install focused backend dependencies
        run: >-
          python -m pip install --quiet
          fastapi==0.110.1
          python-dotenv
          motor==3.3.1
          pymongo==4.5.0
          httpx==0.28.1
          openai==1.99.9
          PyJWT==2.12.1
          pandas==3.0.1
          email-validator==2.3.0
          python-multipart==0.0.22
      - name: Validate backend syntax
        run: python -m py_compile backend/product_catalog.py backend/strict_catalog_ai.py backend/photo_diagnosis.py backend/server.py
      - name: Run permanent scenario suite
        id: permanent
        continue-on-error: true
        run: python -m unittest -v tests/test_baikov_regression_suite.py 2>&1 | tee /tmp/permanent.log
      - name: Show permanent suite result
        if: always()
        run: cat /tmp/permanent.log
      - name: Fail when permanent suite failed
        if: steps.permanent.outcome == 'failure'
        run: exit 1
      - name: Run strict catalog tests
        run: python -m unittest -v tests/test_supabase_strict_catalog.py
      - name: Run AI chat tests
        run: python -m unittest -v tests/test_ai_chat.py
      - name: Run unified catalog tests
        run: python -m unittest -v tests/test_unified_catalog.py
      - name: Run photo diagnosis tests
        run: python -m unittest -v tests/test_photo_diagnosis.py
      - name: Run account and limits tests
        run: python -m unittest -v tests/test_account_limits.py
      - name: Commit PR83 source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py frontend/src/auth/AuthContext.tsx frontend/src/components/AIAuthGate.tsx 'frontend/app/(tabs)/index.tsx' frontend/app/_layout.tsx frontend/app/account.tsx
          git diff --cached --quiet || git commit -m "Add personal account and update trial limits"
          git push

  frontend-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr-83-account-and-trial-limits
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply PR83 source patch
        working-directory: .
        run: python scripts/apply_account_limits_v2.py
      - name: Fix account TypeScript compatibility
        working-directory: .
        run: python scripts/fix_account_types.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Yarn 1
        run: npm install --global yarn@1.22.22 --silent
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --silent
      - name: TypeScript check
        run: yarn exec tsc --noEmit
