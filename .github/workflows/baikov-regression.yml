name: bAIkov regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-seed-treatment-prefix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr-84-test-payments
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply prefix fix
        run: python scripts/fix_seed_treatment_prefix.py
      - name: Verify permanent regression
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: baikov_test
          AUTH_JWT_SECRET: test-secret-with-at-least-thirty-two-characters
        run: |
          python -m pip install --quiet fastapi==0.110.1 python-dotenv motor==3.3.1 pymongo==4.5.0 httpx==0.28.1 openai==1.99.9 PyJWT==2.12.1 pandas==3.0.1 email-validator==2.3.0 python-multipart==0.0.22
          python -m unittest -v tests/test_baikov_regression_suite.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/strict_catalog_ai.py scripts/fix_seed_treatment_prefix.py
          git diff --cached --quiet || git commit -m "Fix seed treatment product prefix parsing"
          git pull --rebase origin agent/pr-84-test-payments
          git push origin HEAD:agent/pr-84-test-payments
